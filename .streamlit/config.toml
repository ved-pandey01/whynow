# Look of the web page: white background, navy main colour, teal accent (see ui/style.css).
[theme]
base = "light"
primaryColor = "#1E3A8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#111827"
font = "sans serif"

[client]
toolbarMode = "minimal"

# Don't send anonymous usage statistics to Streamlit
[browser]
gatherUsageStats = false

# Only this computer can open the page (so no one else on your Wi-Fi can use your API credits).
# Revisit in Stage 3 when the app is hosted.
[server]
address = "localhost"
