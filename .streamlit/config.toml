# Look of the web page: light background, royal blue main colour, emerald and amber accents (see ui/style.css).
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EFF6FF"
textColor = "#0F172A"
font = "sans serif"

[client]
toolbarMode = "minimal"

# Don't send anonymous usage statistics to Streamlit
[browser]
gatherUsageStats = false

# Only this computer can open the page (so no one else on your Wi-Fi can use your API credits).
# Revisit in Stage 3 when the app is hosted.
[server]
address = "localhost"
