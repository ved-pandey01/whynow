# Look of the web page: premium dark theme, royal blue and emerald accents (see ui/style.css).
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#CBD5E1"
font = "sans serif"

[client]
toolbarMode = "minimal"

# Don't send anonymous usage statistics to Streamlit
[browser]
gatherUsageStats = false

# Only this computer can open the page (so no one else on your Wi-Fi can use your API credits).
# Revisit in Stage 3 when the app is hosted.
[server]
address = "localhost"
