<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">How WhyNow works</title>
<desc id="desc">Three stages. 1 Find: a company name or website is matched on Companies House, with a brand-to-legal-name lookup. 2 Research: Tavily finds the company profile, news, buying signals and hiring; events older than 6 months are filtered out. 3 Write and verify: Gemini writes from fetched sources only, then code checks every claim, date and size rule. Output: sourced report, 1 to 10 fit score, persona email, LinkedIn note, call opener, PDF and CSV. About 45 seconds in total.</desc>
